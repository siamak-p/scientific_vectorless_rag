[project]
name = "scientific-rag"
version = "1.0.0"
description = "Vectorless RAG for Scientific Papers — PageIndex-inspired reasoning-based retrieval"
requires-python = ">=3.10"
readme = "README.md"

dependencies = [
    # --- Core Frameworks ---
    "streamlit>=1.59.2",
    "langchain>=1.3.14",
    "langchain-core>=1.4.9",
    "langgraph>=1.2.9",
    "langgraph-checkpoint-sqlite>=2.0.0",

    # --- LLM Providers (LangChain) ---
    "langchain-openai>=1.3.5",
    "langchain-anthropic>=1.4.8",
    "langchain-google-genai>=4.2.7",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "langchain-community>=0.4.2",

    # --- Scientific Search ---
    "langchain-tavily>=0.2.18",
    "arxiv>=4.0.0",
    "httpx>=0.28.1",
    "aiohttp>=3.14.1",

    # --- PDF Processing ---
    "PyMuPDF>=1.28.0",

    # --- Database ---
    "aiosqlite>=0.20.0",
    "sqlalchemy[asyncio]>=2.0.51",

    # --- Data & Config ---
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "pandas>=2.2.0",

    # --- Export ---
    "reportlab>=4.2.0",

    # --- Utilities ---
    "python-dateutil>=2.9.0.post0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning"]
